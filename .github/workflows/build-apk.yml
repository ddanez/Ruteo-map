name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: |
          npm install

      - name: Compilar aplicación web (Vite)
        run: |
          npm run build

      - name: Inicializar y sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurar permisos en AndroidManifest.xml (GPS, Cámara e Internet)
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.INTERNET\" />",
                "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
                "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
                "<uses-permission android:name=\"android.permission.CAMERA\" />",
                "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />",
                "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />"
              ];
              const missing = perms.filter(p => !content.includes(p.match(/name="([^"]+)"/)[1])).join("\n    ");
              if (missing) {
                content = content.replace("</manifest>", "    " + missing + "\n</manifest>");
                fs.writeFileSync(file, content, "utf8");
                console.log("Permisos agregados correctamente.");
              }
            }
          '

      - name: Compilar APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RutasYParadas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
