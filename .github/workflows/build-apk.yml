name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos al wrapper de Gradle
        run: chmod +x android/gradlew

      - name: Aceptar licencias del SDK de Android
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Compilar APK (Gradle Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RutasYParadas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
